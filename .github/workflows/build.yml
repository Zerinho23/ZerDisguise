name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          name: "ZerDisguise v${{ steps.version.outputs.VERSION }}"
          files: target/ZerDisguise-*.jar
          body: |
            ## ZerDisguise v${{ steps.version.outputs.VERSION }}
            Descarga el JAR y colócalo en `plugins/` de tu servidor Paper/Spigot 1.20-1.21+.
            ### Requisitos
            - Paper / Spigot 1.20 - 1.21+
            - Java 17+
            - LuckPerms o Vault (recomendado)
            - PlaceholderAPI (opcional)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
