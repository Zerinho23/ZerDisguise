# ── ZerDisguise config.yml ────────────────────────────────────────────────────

  prefix: "&8[&dZerDisguise&8] &r"

  # ── Menú principal ─────────────────────────────────────────────────────────────
  menu:
    title: "&8» &dZerDisguise &8«"
    size: 54   # 54 slots (6 filas) — recomendado

  # ── Prompt de escritura ────────────────────────────────────────────────────────
  prompt:
    title:    "&dEscribe tu disfraz"
    subtitle: "&7Escribe el nombre en el chat..."
    fade-in:  10
    stay:     60
    fade-out: 10

  # ── Rangos predeterminados (usados si LuckPerms/Vault no está instalado) ────────
  # Los rangos REALES se obtienen automáticamente desde LuckPerms o Vault.
  # Solo edita esto si no tienes ningún plugin de permisos.
  ranks:
    owner:
      name: "Owner"
      color: "&4"
      prefix: "&4[&cOwner&4]&r"
      permission: "zerdisguise.rank.owner"
      material: NETHER_STAR
      glass: RED_STAINED_GLASS_PANE
    admin:
      name: "Admin"
      color: "&c"
      prefix: "&c[&4Admin&c]&r"
      permission: "zerdisguise.rank.admin"
      material: DIAMOND
      glass: ORANGE_STAINED_GLASS_PANE
    mod:
      name: "Mod"
      color: "&6"
      prefix: "&6[&eMod&6]&r"
      permission: "zerdisguise.rank.mod"
      material: GOLD_INGOT
      glass: YELLOW_STAINED_GLASS_PANE
    vip:
      name: "VIP"
      color: "&e"
      prefix: "&e[&6VIP&e]&r"
      permission: "zerdisguise.rank.vip"
      material: EMERALD
      glass: LIME_STAINED_GLASS_PANE
    default:
      name: "Default"
      color: "&7"
      prefix: "&7[&fDefault&7]&r"
      permission: "zerdisguise.rank.default"
      material: STONE
      glass: GRAY_STAINED_GLASS_PANE

  # ── Mensajes ───────────────────────────────────────────────────────────────────
  messages:
    no-permission:      "&cNo tienes permiso para hacer eso."
    player-only:        "&cEste comando es solo para jugadores."
    disguise-applied:   "&7Disfraz aplicado&8: &d{disguise} &8| &7Rango&8: &f{rank}"
    disguise-removed:   "&aDisfraz removido correctamente."
    player-not-found:   "&cJugador &f{player} &cno encontrado."
    write-disguise:     "&7Escribe el nombre del disfraz en el chat..."
    cancelled:          "&cCancelado."
    reload:             "&aConfiguración recargada correctamente."
  