name: ZerDisguise
version: 2.0.0
main: me.zerith.zerdisguise.ZerDisguise
api-version: "1.20"
description: Plugin de disfraces con GUI interactiva — v2
author: zerinho23
softdepend:
  - Vault
  - LuckPerms
  - PlaceholderAPI

commands:
  disguise:
    description: Abre el menu de disfraces
    usage: /<command> [remove|reload|<jugador>]
    permission: zerdisguise.use
    aliases:
      - disfraz
      - zd
      - zerdisguise

permissions:
  zerdisguise.use:
    description: Usar el menu de disfraces
    default: true
  zerdisguise.others:
    description: Disfrazar a otros jugadores
    default: op
  zerdisguise.reload:
    description: Recargar la configuracion
    default: op
  zerdisguise.rank.default:
    description: Puede seleccionar el rango default
    default: true
  zerdisguise.rank.vip:
    description: Puede seleccionar el rango VIP
    default: op
  zerdisguise.rank.mod:
    description: Puede seleccionar el rango Mod
    default: op
  zerdisguise.rank.admin:
    description: Puede seleccionar el rango Admin
    default: op
  zerdisguise.rank.owner:
    description: Puede seleccionar el rango Owner
    default: op
